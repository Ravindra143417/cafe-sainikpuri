<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Backyard Cafe – Boutique restaurant in Sainikpuri, Secunderabad. Open-air dining, craft coffee, global cuisine, live sports. Open 11AM–11PM.">
<title>Backyard Cafe | Sainikpuri, Secunderabad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --ink:#0E0B06;--bark:#1E1208;--mahog:#3A1A0A;
  --ember:#C4622D;--gold:#D4A843;--sand:#E8CFA0;--cream:#F5ECD8;
  --fog:#7A6A56;--white:#FFFEF9;--leaf:#3D5A2E;
  --ff-d:'Cormorant Garamond',Georgia,serif;
  --ff-s:'Great Vibes',cursive;
  --ff-b:'Outfit',sans-serif;
}
body{font-family:var(--ff-b);background:var(--bark);color:var(--cream);overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--ink)}::-webkit-scrollbar-thumb{background:var(--ember);border-radius:2px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:999;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;height:68px;transition:all .4s}
nav.scrolled{background:rgba(14,11,6,.95);backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(212,168,67,.15)}
.nav-logo{font-family:var(--ff-s);font-size:2rem;color:var(--gold);text-decoration:none}
.nav-links{display:flex;gap:2rem;list-style:none;align-items:center}
.nav-links a{text-decoration:none;font-size:.75rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,207,160,.7);transition:color .2s;position:relative;padding-bottom:3px}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:width .3s}
.nav-links a:hover{color:var(--gold)}.nav-links a:hover::after{width:100%}
.nav-cta{background:var(--ember)!important;color:var(--white)!important;padding:9px 22px!important;border-radius:50px!important;letter-spacing:.08em!important;transition:all .2s!important}
.nav-cta:hover{background:#A8521F!important;transform:translateY(-1px)!important}.nav-cta::after{display:none!important}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.hamburger span{display:block;width:24px;height:2px;background:var(--sand);border-radius:2px}
.mob-overlay{display:none;position:fixed;inset:0;z-index:998;background:rgba(14,11,6,.98);flex-direction:column;align-items:center;justify-content:center;gap:2.5rem}
.mob-overlay.open{display:flex}
.mob-overlay a{font-family:var(--ff-d);font-size:2.5rem;color:var(--sand);text-decoration:none;transition:color .2s}
.mob-overlay a:hover{color:var(--gold)}
.mob-close{position:absolute;top:22px;right:5vw;background:none;border:none;font-size:2rem;color:var(--sand);cursor:pointer}

/* HERO */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 5vw 80px;position:relative;overflow:hidden}

/* FIX: Image is now linked externally instead of embedded */
.hero-bg{
  position:absolute;
  inset:0;
  background-image:url('hero-bg.jpg'); 
  background-size: cover;
  background-position: center;
}
</style>
</head>
<body>
<!-- The rest of your HTML content goes here -->
</body>
</html>
